[package]
name = "message-system"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
env_logger = "0.11.8"
futures-util = "0.3.31"
log = "0.4.28"
rdkafka = "0.38.0"
tokio = "1.48.0"
tokio-stream = "0.1.17"
tracing-subscriber = "0.3.20"
services = {path = "./services"}
serde_json = "1.0.145"
serde = "1.0.228"

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "process", "time", "net"] }
tokio-tungstenite = "0.28.0"

[workspace]
members = [
    "api",
    "store",
    "services",
]
